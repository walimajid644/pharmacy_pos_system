name: Quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run verify
      - run: npm audit --audit-level=moderate
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: npm run audit:rust
      - name: Build isolated native acceptance application
        run: node node_modules/@tauri-apps/cli/tauri.js build --debug --no-bundle --config tests/tauri-native.conf.json -- --offline
      - run: node tests/native_desktop_smoke.mjs
      - run: node tests/native_desktop_smoke.mjs --verify-persistence
      - run: python tests/native_snapshot_smoke.py
      - run: node tests/native_desktop_smoke.mjs --verify-security
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-verification
          path: test-results/
          retention-days: 14
